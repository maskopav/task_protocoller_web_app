<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A5A32"/><stop offset=".45" stop-color="#B9784A"/><stop offset="1" stop-color="#94562F"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A4A2E"/><stop offset="1" stop-color="#8E5A3A"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3E7EA"/><stop offset=".5" stop-color="#9AA3AA"/><stop offset="1" stop-color="#C9CFD4"/>
    </linearGradient>
  </defs>
  <g transform="translate(0 4)">

  <!-- outer coil: inside of the back half (darker suede side) -->
  <path d="M8 38A42 24 0 0 1 92 38L92 54A42 24 0 0 0 8 54Z" fill="url(#back)" stroke="#5E3720" stroke-width=".8"/>
  <!-- inner coil -->
  <path d="M20 42A30 15 0 0 1 80 42L80 52A30 15 0 0 0 20 52Z" fill="#6E4229" stroke="#5E3720" stroke-width=".8"/>
  <path d="M20 42A30 15 0 0 0 80 42L80 52A30 15 0 0 1 20 52Z" fill="url(#face)" stroke="#5E3720" stroke-width=".8"/>
  <path d="M22.5 45A27.5 13.5 0 0 0 77.5 45" stroke="#E6C29C" stroke-opacity=".7" stroke-width=".7" stroke-dasharray="1.6 1.4" fill="none"/>
  <!-- outer coil: front face -->
  <path d="M8 38A42 24 0 0 0 92 38L92 54A42 24 0 0 1 8 54Z" fill="url(#face)" stroke="#5E3720" stroke-width=".8"/>
  <path d="M10.5 41A39.5 22 0 0 0 89.5 41" stroke="#E6C29C" stroke-opacity=".8" stroke-width=".8" stroke-dasharray="1.8 1.5" fill="none"/>
  <path d="M10.5 52A39.5 22 0 0 0 89.5 52" stroke="#E6C29C" stroke-opacity=".8" stroke-width=".8" stroke-dasharray="1.8 1.5" fill="none"/>
  <path d="M14 47C24 58 38 63 50 63.5" stroke="#fff" stroke-opacity=".18" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- punched holes -->
  <g fill="#4A2A17"><ellipse cx="44" cy="70" rx="1.5" ry="1.2"/><ellipse cx="52" cy="70.2" rx="1.5" ry="1.2"/></g>
  <!-- metal keeper loop -->
  <path d="M24 55.5L31 59.5L31 76L24 72Z" fill="url(#metal)" stroke="#7D868D" stroke-width=".8"/>
  <!-- buckle -->
  <g transform="rotate(-24 76 64)">
    <rect x="64" y="54" width="24" height="20" rx="4" fill="none" stroke="url(#metal)" stroke-width="4"/>
    <rect x="64" y="54" width="24" height="20" rx="4" fill="none" stroke="#6F777E" stroke-width=".7"/>
    <rect x="62" y="52" width="28" height="24" rx="6" fill="none" stroke="#6F777E" stroke-width=".7"/>
    <rect x="66.5" y="60" width="19" height="8" fill="#A86A3D"/>
    <path d="M66 64H82" stroke="url(#metal)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M66 64H82" stroke="#6F777E" stroke-width=".5" stroke-linecap="round"/>
  </g>
  </g>
</svg>
