<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site dashboard · TaskProtocoller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="dashboard-page" id="app"></div>

<script src="assets/mock-data.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  const U = window.UM, D = U.D;
  U.previewBar("site.html");
  const app = document.getElementById("app");
  const site = U.site((location.hash || "").slice(1)) || D.sites[0];

  const ss = D.sessions.filter((s) => s.site === site.id).sort((a, b) => b.receivedAt.localeCompare(a.receivedAt));
  const devs = D.devices.filter((d) => d.site === site.id).map((d) => ({ ...d, h: U.deviceHealth(d) }));
  const in30 = ss.filter((s) => (D.NOW - new Date(s.receivedAt)) / 864e5 <= 30).length;
  const invalid = ss.filter((s) => s.status === "invalid").length;
  const review = ss.filter((s) => s.qc === "review").length;

  // uploads per day, last 21 days
  const days = Array.from({ length: 21 }, (_, i) => { const d = new Date(D.NOW.getTime() - (20 - i) * 864e5); return d.toISOString().slice(0, 10); });
  const perDay = days.map((d) => ss.filter((s) => s.receivedAt.slice(0, 10) === d));
  const max = Math.max(2, ...perDay.map((x) => x.length));
  const bars = perDay.map((list, i) => {
    const h = list.length / max * 56, bad = list.some((s) => s.status === "invalid");
    return `<rect x="${i * 14 + 2}" y="${62 - h}" width="10" height="${h}" rx="2" fill="${bad ? "var(--danger)" : "var(--primary)"}"><title>${days[i]}: ${list.length} upload(s)</title></rect>`;
  }).join("");

  app.innerHTML = `
    ${U.topbar()}
    <div class="page-header">
      <div class="page-title-row"><h1 class="page-title">${U.esc(site.name)}</h1><span class="pill ok lg">Active</span>
        <div class="page-actions"><button class="btn btn-primary" type="button">Edit</button></div></div>
      <div class="meta-grid" style="margin-top:.5rem">
        <div class="meta-item"><span class="m-label">Country</span><span class="m-value">📍 ${U.esc(site.country)}</span></div>
        <div class="meta-item"><span class="m-label">Contact person(s)</span><span class="m-value">👤 ${U.esc(site.contact)}</span></div>
        <div class="meta-item"><span class="m-label">Projects</span><span class="m-value">${site.projects.map(U.esc).join(", ")}</span></div>
      </div>
    </div>

    <section class="card">
      <h2 class="stats-title">Overall statistics</h2>
      <div class="stats">
        <div class="stat"><span class="s-value">${site.projects.length}</span><span class="s-label">Assigned Projects</span></div>
        <div class="stat"><span class="s-value">${site.projects.length + 1}</span><span class="s-label">Inherited Protocols</span></div>
        <div class="stat"><span class="s-value">${in30}</span><span class="s-label">Uploads · 30 days</span></div>
        <div class="stat"><span class="s-value bad">${invalid}</span><span class="s-label">Invalid</span></div>
        <div class="stat"><span class="s-value warn">${review}</span><span class="s-label">Needs review</span></div>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2 class="section-title">Uploads</h2>
        <a class="btn btn-primary btn-sm" href="uploads.html#${site.id}">View all ${ss.length} →</a>
      </div>
      <div class="detail-grid" style="grid-template-columns:minmax(0,1fr) 320px">
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Received</th><th>Patient</th><th>Protocol</th><th>Device</th><th>Server check</th><th>Review</th><th>Flags</th></tr></thead>
            <tbody>${ss.slice(0, 8).map((s) => `<tr class="clickable ${s.status === "invalid" ? "row-bad" : U.needsAttention(s) ? "row-warn" : ""}" onclick="location.href='session.html#${s.id}'">
              <td><div class="stack"><span class="num">${U.fmtDT(s.receivedAt)}</span><span class="cell-sub">${U.rel(s.receivedAt)}</span></div></td>
              <td class="cell-main">${U.esc(s.participant.patient_code)}</td>
              <td>${U.esc(s.protocol)}</td>
              <td class="cell-sub">${U.esc(U.device(s.deviceId).label)}</td>
              <td>${U.statusPill(s)}</td><td>${U.qcPill(s.qc)}</td><td class="flags">${U.issueTags(s)}</td></tr>`).join("")}</tbody>
          </table>
        </div>
        <div style="display:flex;flex-direction:column;gap:.75rem;min-width:0">
          <div class="panel">
            <span class="m-label" style="font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)">Uploads per day · last 21 days</span>
            <svg viewBox="0 0 296 76" role="img" aria-label="Uploads per day" style="width:100%;height:auto">
              <line x1="0" y1="62.5" x2="296" y2="62.5" stroke="var(--row-border)"/>
              ${bars}
              <text x="0" y="74" font-size="8" fill="var(--dark-gray)">${U.fmtDate(days[0] + "T00:00:00Z")}</text>
              <text x="296" y="74" font-size="8" fill="var(--dark-gray)" text-anchor="end">today</text>
            </svg>
          </div>
          <div class="panel">
            <div class="section-head"><span class="m-label" style="font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)">Devices ${U.PB("device check-in")}</span><a href="devices.html" style="font-size:.82rem">All devices →</a></div>
            ${devs.map((d) => `<div style="display:flex;justify-content:space-between;gap:.5rem;align-items:center;font-size:.86rem">
              <span class="stack" style="display:flex;flex-direction:column"><strong>${U.esc(d.label)}</strong><span class="cell-sub" style="font-size:.75rem;color:var(--dark-gray)">seen ${U.rel(d.lastSeen)}${d.localPending ? ` · ${d.localPending} waiting` : ""}</span></span>
              <span class="pill ${d.h.cls}"><span class="dot"></span>${d.h.label}</span></div>`).join("")}
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="section-head" style="margin-bottom:.5rem"><h2 class="section-title plain">Assigned Projects</h2><button class="btn btn-primary" type="button">Manage Projects</button></div>
      <div class="card">
        <div class="table-wrap"><table class="table"><thead><tr><th>Project Name</th><th>Status</th><th>Date Assigned</th></tr></thead>
        <tbody>${site.projects.map((p) => `<tr><td class="cell-main">${U.esc(p)}</td><td>Active</td><td class="num">28. 9. 2026</td></tr>`).join("")}</tbody></table></div>
      </div>
    </section>

    <p class="annot"><b>Site dashboard.</b> The existing page (<span class="mono">SiteDashboardPage</span>) keeps its header and statistics card; three upload numbers join the statistics, and a new Uploads card shows the 8 latest sessions plus the site's devices. “View all” opens the Uploads page already filtered to this site.</p>
  `;
})();
</script>
</body>
</html>
