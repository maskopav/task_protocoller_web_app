name: Deploy via FTP

on:
  push:
    branches:
      - main 

# Nothing here writes to the repo; keep the token read-only.
permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    # Actions are pinned to commit SHAs, not tags: a tag can be moved to new
    # code, and the SFTP action is handed FTP_PASSWORD.
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # --- 1. SETUP NODE.JS ---
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20' 

      # --- 2. BUILD FRONTEND ---
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # --- 3. UPLOAD FRONTEND VIA SFTP ---
      # sftp_only: true is required -- this account has no SSH shell/exec
      # access (confirmed with the account holder), only the SFTP subsystem.
      # Without this flag, the action falls back to SSH-exec calls (e.g. to
      # create the remote directory) that this account can't run, which is
      # the likely cause of every run hanging to a ~16min timeout and failing
      # before this fix. NOTE: with sftp_only: true, the action does NOT
      # auto-create the remote folder -- '/dist' must already exist on the
      # server before this step runs.
      - name: Upload Frontend to Server
        uses: wlixcc/SFTP-Deploy-Action@da88a4dbe95286266bbac3c0b2b8284048d20c8f # v1.2.4
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_HOST }}
          port: ${{ secrets.FTP_PORT }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: './frontend/dist/*'
          remote_path: '/dist'
          sftp_only: true
          sftpArgs: '-o ConnectTimeout=5'

      # --- 4. PREPARE BACKEND (DELETE NODE_MODULES) ---
      - name: Remove Backend node_modules before upload
        run: rm -rf ./backend/node_modules

      # Dev-only files never belong on the server: the seeds carry a known
      # master password and guessable site tokens.
      - name: Remove dev-only backend files before upload
        run: |
          rm -rf ./backend/scripts/seed ./backend/hash_gen.js
          find ./backend/src -name '*.test.js' -delete

      # --- 5. UPLOAD BACKEND VIA SFTP ---
      - name: Upload Backend to Server
        uses: wlixcc/SFTP-Deploy-Action@da88a4dbe95286266bbac3c0b2b8284048d20c8f # v1.2.4
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_HOST }}
          port: ${{ secrets.FTP_PORT }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: './backend/*'
          sftp_only: true 
          sftpArgs: '-o ConnectTimeout=5'
          # Change to your real WEDOS backend folder path
          remote_path: '/dist/backend'
